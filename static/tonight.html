<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#090612">
<title>池袋今晚可约｜Alice Academy</title>
<style>
:root{--bg:#080611;--panel:#11101f;--panel2:#181329;--pink:#ff4da6;--pink2:#ff95cb;--cyan:#55e8ff;--gold:#ffd56a;--text:#fff9fd;--muted:#bdb2c8;--line:#382a4d;--ok:#82f0c2}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;color:var(--text);font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN","Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 8% 0,#35122d 0,transparent 28rem),radial-gradient(circle at 95% 18%,#092d43 0,transparent 27rem),var(--bg)}
button,input,select{font:inherit}.shell{width:min(1120px,100%);margin:auto;padding:18px clamp(14px,3vw,32px) 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.mark{display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--pink);border-radius:15px;background:linear-gradient(145deg,#32132e,#101d30);color:var(--pink2);font-size:23px;box-shadow:0 0 20px #ff4da647}.brand b,.brand small{display:block}.brand b{font-family:Georgia,"Times New Roman",serif;font-size:19px;font-style:italic;letter-spacing:.04em}.brand small{margin-top:2px;color:var(--muted);font-size:10px;letter-spacing:.16em}.lang{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:#0e0b19}.lang button{min-width:46px;padding:7px 10px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.lang button.on{background:var(--pink);color:white;box-shadow:0 0 13px #ff4da667}
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:18px;align-items:end;margin-bottom:16px;padding:clamp(22px,4vw,42px);border:1px solid #4d3156;border-radius:28px;background:linear-gradient(120deg,rgba(255,77,166,.18),rgba(17,16,31,.88) 48%,rgba(85,232,255,.11));box-shadow:0 22px 60px #0008,inset 0 0 0 1px #ffffff0b;overflow:hidden}.eyebrow{margin:0 0 9px;color:var(--cyan);font-size:12px;font-weight:900;letter-spacing:.16em}.hero h1{margin:0;font-size:clamp(31px,6vw,62px);line-height:1.03;letter-spacing:-.045em;text-shadow:0 0 22px #ff4da65c}.hero p{max-width:600px;margin:14px 0 0;color:#ded4e5;line-height:1.75}.livebox{padding:18px;border:1px solid #4d3f5e;border-radius:21px;background:#080711a6;backdrop-filter:blur(10px)}.livehead{display:flex;align-items:center;justify-content:space-between;gap:10px}.dot{display:inline-block;width:8px;height:8px;margin-right:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);animation:pulse 1.5s infinite}.livebox strong{color:var(--gold);font-size:30px}.livebox small{display:block;margin-top:5px;color:var(--muted)}
.filters{position:sticky;top:8px;z-index:20;margin-bottom:18px;padding:13px;border:1px solid var(--line);border-radius:22px;background:#0d0a18ed;box-shadow:0 14px 34px #0008;backdrop-filter:blur(16px)}.date-tabs,.filter-row,.quick-times{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.date-tabs{margin-bottom:10px}.date-tabs button,.quick-times button,.reload{min-height:40px;padding:8px 13px;border:1px solid var(--line);border-radius:13px;background:#171225;color:var(--muted);font-weight:850;cursor:pointer}.date-tabs button.on,.quick-times button.on{border-color:var(--pink);background:#37142e;color:white;box-shadow:inset 0 0 12px #ff4da624}.filter-row{display:grid;grid-template-columns:1.35fr 1fr 1fr auto}.filter-row input,.filter-row select{width:100%;min-height:45px;padding:0 13px;border:1px solid #493657;border-radius:13px;outline:none;background:#161221;color:white}.filter-row input:focus,.filter-row select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px #55e8ff1c}.quick-times{margin-top:9px}.filter-label{color:var(--muted);font-size:12px;font-weight:800}.reload{color:var(--cyan)}
.result-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:22px 2px 12px}.result-head h2{margin:0;font-size:21px}.result-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.updated{color:var(--muted);font-size:11px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.girl{position:relative;display:grid;grid-template-columns:94px minmax(0,1fr);gap:15px;min-height:174px;padding:15px;border:1px solid #473454;border-radius:22px;background:linear-gradient(135deg,#191329,#0d111d);box-shadow:0 14px 32px #0006;overflow:hidden}.girl::after{content:"";position:absolute;right:-50px;bottom:-75px;width:150px;height:150px;border:1px solid #ff4da638;border-radius:50%;box-shadow:0 0 50px #ff4da61f}.avatar{position:relative;width:94px;height:118px;border:1px solid var(--pink);border-radius:17px;overflow:hidden;background:linear-gradient(145deg,#39152f,#12293a);box-shadow:0 0 17px #ff4da63b}.avatar img{width:100%;height:100%;display:block;object-fit:cover}.avatar span{display:grid;place-items:center;width:100%;height:100%;font-size:28px;font-weight:900;color:var(--pink2)}.trend{position:absolute;left:7px;bottom:7px;padding:4px 7px;border-radius:999px;background:#ff4da6e8;color:white;font-size:9px;font-weight:900}.girl-top{display:flex;align-items:start;justify-content:space-between;gap:8px}.name{margin:0;font-size:22px;line-height:1.1}.price{flex:0 0 auto;color:var(--gold);font-size:17px;font-weight:900}.price small{font-size:10px}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{padding:4px 7px;border:1px solid #55e8ff5c;border-radius:999px;background:#102331;color:#c9f8ff;font-size:10px;font-weight:800}.shift{margin-top:9px;color:#f7d9eb;font-size:12px;font-weight:800}.free-title{margin-top:8px;color:var(--muted);font-size:10px}.slots{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}.slot{padding:5px 8px;border-radius:9px;background:#173127;color:var(--ok);font-size:11px;font-weight:900}.full{padding:6px 9px;border-radius:9px;background:#331522;color:#ff9ebb;font-size:11px;font-weight:900}.book{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;margin-top:11px;padding:9px 13px;border-radius:12px;background:linear-gradient(135deg,var(--pink),#a640c5);color:white;text-decoration:none;font-size:12px;font-weight:900;box-shadow:0 8px 18px #ff4da62e}
.state{grid-column:1/-1;padding:45px 20px;border:1px dashed #513a61;border-radius:22px;text-align:center;color:var(--muted)}.spinner{width:36px;height:36px;margin:0 auto 13px;border:3px solid #37283f;border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite}.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:#8e819a;font-size:11px;line-height:1.7;text-align:center}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.38;transform:scale(.82)}}
@media(max-width:720px){.shell{padding:12px 10px 52px}.topbar{margin-bottom:12px}.hero{grid-template-columns:1fr;padding:24px 18px;border-radius:23px}.hero h1{font-size:38px}.livebox{display:flex;align-items:center;justify-content:space-between}.filters{top:4px;padding:10px;border-radius:17px}.filter-row{grid-template-columns:1fr 1fr}.filter-row input{grid-column:1/-1}.reload{width:100%}.grid{grid-template-columns:1fr}.girl{grid-template-columns:82px minmax(0,1fr);gap:12px;padding:13px;min-height:160px}.avatar{width:82px;height:106px}.name{font-size:20px}.price{font-size:15px}.result-head{align-items:start}.updated{max-width:110px;text-align:right}.date-tabs button,.quick-times button{flex:1}.filter-label{width:100%}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="topbar">
    <a class="brand" href="https://ailisi99.com/" target="_blank" rel="noopener"><span class="mark">♕</span><span><b>Alice Academy</b><small>IKEBUKURO · REAL TIME</small></span></a>
    <div class="lang" aria-label="Language"><button id="zhBtn" class="on" onclick="setLang('zh')">中文</button><button id="jaBtn" onclick="setLang('ja')">日本語</button></div>
  </header>

  <section class="hero">
    <div><p class="eyebrow">LIVE AVAILABILITY · 24H</p><h1 data-i18n="title">池袋今晚可约</h1><p data-i18n="lead">实时查看女孩出勤、每小时价格与 MCR 当前空档。预约前数据会再次确认，以最新状态为准。</p></div>
    <div class="livebox"><div class="livehead"><span><i class="dot"></i><span data-i18n="live">实时更新中</span></span><strong id="availableCount">—</strong></div><small data-i18n="available">位女孩当前仍有空档</small></div>
  </section>

  <section class="filters" aria-label="筛选">
    <div class="date-tabs"><button id="todayBtn" class="on" onclick="pickDay(0)">今天</button><button id="tomorrowBtn" onclick="pickDay(1)">明天</button><input id="customDate" type="date" aria-label="选择日期" onchange="pickCustomDay()" style="position:absolute;opacity:0;pointer-events:none"><button onclick="openDatePicker()" data-i18n="otherDate">其他日期</button></div>
    <div class="filter-row"><input id="query" type="search" placeholder="搜索女孩或 TAG" oninput="render()"><select id="price" onchange="render()"><option value="0">全部价格</option><option value="16000">¥16,000以内</option><option value="18000">¥18,000以内</option><option value="20000">¥20,000以内</option><option value="25000">¥25,000以内</option></select><select id="sort" onchange="render()"><option value="popular">综合人气</option><option value="early">最早空档</option><option value="price">价格由低到高</option></select><button class="reload" onclick="loadData()" data-i18n="refresh">↻ 刷新空档</button></div>
    <div class="quick-times"><span class="filter-label" data-i18n="from">从这个时间以后：</span><button class="on" data-time="" onclick="setTime(this,'')">全部</button><button data-time="18:00" onclick="setTime(this,'18:00')">18:00</button><button data-time="21:00" onclick="setTime(this,'21:00')">21:00</button><button data-time="00:00" onclick="setTime(this,'00:00')">00:00</button></div>
  </section>

  <div class="result-head"><div><h2 id="resultTitle">今日实时空档</h2><p data-i18n="source">空档与预约占用直接读取 Alice MCR</p></div><span class="updated" id="updated"></span></div>
  <section class="grid" id="grid"><div class="state"><div class="spinner"></div><span data-i18n="loading">正在读取实时空档…</span></div></section>
  <footer class="foot" data-i18n="notice">显示结果仅供即时参考；提交预约时系统会再次检查空档，避免重复预约。临时预览页面。</footer>
</main>
<script>
const I18N={
 zh:{title:'池袋今晚可约',lead:'实时查看女孩出勤、每小时价格与 MCR 当前空档。预约前数据会再次确认，以最新状态为准。',live:'实时更新中',available:'位女孩当前仍有空档',otherDate:'其他日期',refresh:'↻ 刷新空档',from:'从这个时间以后：',source:'空档与预约占用直接读取 Alice MCR',loading:'正在读取实时空档…',notice:'显示结果仅供即时参考；提交预约时系统会再次检查空档，避免重复预约。临时预览页面。',today:'今天',tomorrow:'明天',allPrice:'全部价格',popular:'综合人气',early:'最早空档',price:'价格由低到高',result:'实时空档',free:'可约时间',shift:'出勤',full:'暂时满约',book:'前往 Telegram 预约',empty:'没有符合条件的空档',retry:'读取失败，请点击刷新重试',all:'全部',updated:'更新'},
 ja:{title:'池袋・今夜の空き状況',lead:'出勤、1時間料金、Alice MCRの最新空き時間をリアルタイムで確認できます。予約時にもう一度最新状況を確認します。',live:'リアルタイム更新中',available:'名が現在ご案内可能です',otherDate:'日付を選ぶ',refresh:'↻ 空きを更新',from:'この時間以降：',source:'空き状況と予約は Alice MCR から直接取得',loading:'最新の空き状況を確認しています…',notice:'表示はリアルタイムの参考情報です。重複予約を防ぐため、予約送信時にもう一度確認します。現在はプレビューページです。',today:'今日',tomorrow:'明日',allPrice:'すべての料金',popular:'総合人気順',early:'早い空き順',price:'料金の安い順',result:'リアルタイム空き状況',free:'ご案内可能時間',shift:'出勤',full:'ただいま満了',book:'Telegramで予約',empty:'条件に合う空きがありません',retry:'読み込みに失敗しました。更新してください',all:'すべて',updated:'更新'}
};
let lang='zh',day='',girls=[],timeFilter='',loading=true,error='';
const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tokyoDate(offset=0){const now=new Date(Date.now()+offset*86400000);const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const map=Object.fromEntries(parts.map(x=>[x.type,x.value]));return `${map.year}-${map.month}-${map.day}`}
function setLang(next){lang=next;document.documentElement.lang=next==='ja'?'ja':'zh-CN';el('zhBtn').classList.toggle('on',next==='zh');el('jaBtn').classList.toggle('on',next==='ja');document.querySelectorAll('[data-i18n]').forEach(x=>x.textContent=I18N[next][x.dataset.i18n]||x.textContent);el('todayBtn').textContent=I18N[next].today;el('tomorrowBtn').textContent=I18N[next].tomorrow;el('query').placeholder=next==='ja'?'名前・タグで検索':'搜索女孩或 TAG';el('price').options[0].text=I18N[next].allPrice;el('sort').options[0].text=I18N[next].popular;el('sort').options[1].text=I18N[next].early;el('sort').options[2].text=I18N[next].price;render()}
function pickDay(offset){day=tokyoDate(offset);el('todayBtn').classList.toggle('on',offset===0);el('tomorrowBtn').classList.toggle('on',offset===1);loadData()}
function pickCustomDay(){if(!el('customDate').value)return;day=el('customDate').value;el('todayBtn').classList.remove('on');el('tomorrowBtn').classList.remove('on');loadData()}
function openDatePicker(){el('customDate').style.pointerEvents='auto';if(el('customDate').showPicker)el('customDate').showPicker();else el('customDate').click();setTimeout(()=>el('customDate').style.pointerEvents='none',100)}
function setTime(btn,value){timeFilter=value;document.querySelectorAll('[data-time]').forEach(x=>x.classList.toggle('on',x===btn));render()}
function mins(t){let [h,m]=String(t).split(':').map(Number);if(h<6)h+=24;return h*60+(m||0)}
function mergedRanges(slots){const rows=(slots||[]).map(x=>({a:mins(x.start),b:mins(x.end),start:x.start,end:x.end})).sort((x,y)=>x.a-y.a),out=[];for(const row of rows){const last=out[out.length-1];if(last&&last.b===row.a){last.b=row.b;last.end=row.end}else out.push({...row})}return out}
function avatarHtml(g){const url=String(g.avatar_url||'');return url?`<img src="${esc(url)}?v=${encodeURIComponent(g.avatar_updated_at||'')}" alt="${esc(g.girl)}" loading="lazy">`:`<span>${esc(String(g.girl||'?').slice(0,2))}</span>`}
function visibleRows(){const q=el('query').value.trim().toLowerCase(),max=Number(el('price').value||0);let rows=girls.filter(g=>(!q||`${g.girl} ${g.tags||''}`.toLowerCase().includes(q))&&(!max||Number(g.price||0)<=max));if(timeFilter){const cut=mins(timeFilter);rows=rows.filter(g=>mergedRanges(g.slots).some(x=>x.b>cut))}const mode=el('sort').value;if(mode==='price')rows.sort((a,b)=>Number(a.price||0)-Number(b.price||0));if(mode==='early')rows.sort((a,b)=>(mergedRanges(a.slots)[0]?.a??9999)-(mergedRanges(b.slots)[0]?.a??9999));return rows}
function render(){const t=I18N[lang];el('resultTitle').textContent=`${day||tokyoDate()} · ${t.result}`;if(loading){el('grid').innerHTML=`<div class="state"><div class="spinner"></div>${t.loading}</div>`;return}if(error){el('grid').innerHTML=`<div class="state">${t.retry}</div>`;return}const rows=visibleRows();el('availableCount').textContent=girls.filter(g=>(g.slots||[]).length).length;el('grid').innerHTML=rows.length?rows.map(g=>{const ranges=mergedRanges(g.slots);const slotHtml=ranges.length?ranges.map(x=>`<span class="slot">${esc(x.start)}–${esc(x.end)}</span>`).join(''):`<span class="full">${t.full}</span>`;const tags=String(g.tags||'').split(/\s+/).filter(Boolean).slice(0,4).map(x=>`<span class="tag">${esc(x)}</span>`).join('');return `<article class="girl"><div class="avatar">${avatarHtml(g)}${g.trending?`<b class="trend">↗ ${lang==='ja'?'急上昇':'人气上升'}</b>`:''}</div><div><div class="girl-top"><h3 class="name">${esc(g.girl)}</h3><span class="price">¥${Number(g.price||0).toLocaleString()}<small>/h</small></span></div><div class="tags">${tags}</div><div class="shift">${t.shift} · ${esc(g.start)}–${esc(g.end)}</div><div class="free-title">${t.free}</div><div class="slots">${slotHtml}</div><a class="book" href="https://t.me/alice_booking_test_bot?start=book" target="_blank" rel="noopener">${t.book} →</a></div></article>`}).join(''):`<div class="state">${t.empty}</div>`}
async function loadData(){loading=true;error='';render();try{const now=new Date();const body={date:day||tokyoDate(),client_now:now.toISOString()};const r=await fetch('/api/customer_available',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});const data=await r.json();if(!r.ok||!data.ok)throw new Error(data.error||'error');girls=data.girls||[];el('updated').textContent=`${I18N[lang].updated} ${new Intl.DateTimeFormat(lang==='ja'?'ja-JP':'zh-CN',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit'}).format(new Date())}`;loading=false;render()}catch(e){loading=false;error=String(e);render()}}
day=tokyoDate();el('customDate').min=day;setLang('zh');loadData();setInterval(loadData,60000);
</script>
</body>
</html>
