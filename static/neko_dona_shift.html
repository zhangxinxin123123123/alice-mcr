<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喵喵出勤表</title>
<style>
:root{--ink:#51483f;--muted:#8c8176;--paper:#fffdf8;--cream:#f7f0e5;--pink:#d98ba0;--pink2:#f6dce3;--sage:#9aaf9d;--line:#dfd4c6;--shadow:0 16px 44px rgba(89,70,54,.14)}
*{box-sizing:border-box}html{background:#f1e9dd}body{margin:0;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Microsoft YaHei",serif;background:linear-gradient(135deg,#f7f0e5,#eadfd1);min-height:100vh;padding:22px}
button,input,select{font:inherit}.shell{width:min(1120px,100%);margin:auto;background:rgba(255,253,248,.94);border:1px solid rgba(181,158,131,.4);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.hero{padding:30px 34px 24px;text-align:center;background:linear-gradient(180deg,#fffdf9,#f9f1e7);border-bottom:1px solid var(--line);position:relative}.hero:before,.hero:after{content:"✿";position:absolute;top:28px;color:#d6a5b1;font-size:28px}.hero:before{left:34px}.hero:after{right:34px}.eyebrow{color:var(--sage);font:700 12px/1 sans-serif;letter-spacing:.3em}.hero h1{margin:10px 0 5px;color:#b8657d;font-size:34px;letter-spacing:.12em}.hero p{margin:0;color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line);background:#fff}.field,.btn{min-height:44px;border:1px solid #d8c8b8;border-radius:12px;padding:9px 14px;background:#fffdf9;color:var(--ink)}.btn{cursor:pointer;font-weight:800}.btn.primary{background:linear-gradient(135deg,#d98ba0,#c97991);color:#fff;border-color:#c97991}.btn.sage{background:#edf3ed;color:#647b68;border-color:#bfcdbf}.btn:disabled{opacity:.55;cursor:wait}.grow{flex:1}.status{width:100%;font-size:13px;color:var(--muted);padding-top:2px}.status.bad{color:#bd4659}.status.good{color:#5a805f}
.content{padding:18px}.notice{padding:13px 15px;border-left:4px solid var(--sage);background:#f3f6f0;border-radius:9px;font-size:13px;line-height:1.7;margin-bottom:14px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:70px minmax(150px,1fr) minmax(250px,1.35fr) minmax(170px,.8fr);gap:13px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px 15px;box-shadow:0 5px 14px rgba(89,70,54,.06)}.num{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--pink2);color:#a85870;font-weight:900}.alias{font-size:22px;color:#9f5770;font-weight:900}.source{color:var(--muted);font:12px/1.4 sans-serif;margin-top:4px}.time{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:7px}.time select,.price input{width:100%;min-width:0;border:1px solid #ddd0c3;border-radius:9px;background:#fff;padding:9px}.price{display:flex;align-items:center;gap:6px;color:#8e6e48;font-weight:800}.price input{text-align:right;color:#8e6e48;font-weight:900}.empty{padding:64px 20px;text-align:center;color:var(--muted);border:1px dashed #cfc0b2;border-radius:14px}
.preview-wrap{padding:0 18px 24px}.preview-title{margin:15px 0 10px;color:#8a715b;font-weight:900}.previews{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.preview-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px}.preview-card img{display:block;width:100%;height:auto;border-radius:9px;background:#f7f0e5}.preview-actions{display:flex;gap:8px;margin-top:9px}.preview-actions .btn{flex:1;min-height:38px;padding:7px 10px;font-size:13px}
.busy-layer{position:fixed;inset:0;background:rgba(248,242,234,.82);backdrop-filter:blur(4px);display:none;place-items:center;z-index:20}.busy-layer.on{display:grid}.spinner{width:50px;height:50px;border:4px solid #ead5da;border-top-color:#c97991;border-radius:50%;animation:spin .8s linear infinite;margin:auto}.busy-text{margin-top:13px;color:#8c6170;font-weight:900}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){body{padding:0}.shell{border:0;border-radius:0;min-height:100vh}.hero{padding:24px 18px 20px}.hero h1{font-size:28px}.hero:before,.hero:after{display:none}.toolbar{padding:12px}.field,.btn{flex:1;min-width:calc(50% - 5px)}.row{grid-template-columns:48px 1fr;padding:12px}.num{width:40px;height:40px}.time,.price{grid-column:1/-1}.content{padding:12px}.previews{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <header class="hero">
    <div class="eyebrow">NEKO MIAOMIAO</div>
    <h1>喵喵出勤表</h1>
    <p>素雅信纸版 · 从爱丽丝 MCR 当日出勤与女孩马甲自动生成</p>
  </header>
  <section class="toolbar">
    <input id="shiftDate" class="field" type="date">
    <button class="btn sage" type="button" onclick="loadMcrAttendance()">重新读取 MCR</button>
    <button class="btn" type="button" onclick="generateImages(true)">生成信纸图</button>
    <button class="btn" type="button" onclick="copyShiftText()">复制文案</button>
    <button id="syncBtn" class="btn primary" type="button" onclick="syncNekoAttendance()">全面同步</button>
    <span class="grow"></span>
    <strong id="countText">0 人</strong>
    <div id="statusLine" class="status">准备读取今日出勤。</div>
  </section>
  <main class="content">
    <div class="notice">这里只显示女孩表中已经填写“马甲”的当日出勤女孩。客用图片仅包含马甲名字、出勤时间和每小时价格，不显示爱丽丝名字、头像或 TAG。</div>
    <div id="shiftList" class="list"></div>
  </main>
  <section id="previewWrap" class="preview-wrap" hidden>
    <div class="preview-title">生成图片（每张最多 6 人）</div>
    <div id="previews" class="previews"></div>
  </section>
</div>
<div id="busyLayer" class="busy-layer"><div><div class="spinner"></div><div id="busyText" class="busy-text">正在处理…</div></div></div>
<script>
(function(){
  const PAGE_SIZE=6;
  let rows=[];
  let imagePages=[];
  function localToday(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
  const today=localToday();
  function authHeaders(json=false){let a=null;try{a=JSON.parse(localStorage.getItem("alice_auth")||"null")}catch(e){}const h=a?{"X-Alice-Role":a.role||"","X-Alice-User":a.username||"","X-Alice-Session":a.session_token||""}:{};if(json)h["Content-Type"]="application/json";return h}
  function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
  function yen(v){return `¥${Math.round(Number(v||0)).toLocaleString()}`}
  function parseMoney(v){return Math.max(0,Math.round(Number(String(v||"").replace(/[^0-9]/g,""))||0))}
  function setStatus(text,type=""){statusLine.textContent=text;statusLine.className=`status ${type}`}
  function busy(on,text="正在处理…"){busyText.textContent=text;busyLayer.classList.toggle("on",!!on);syncBtn.disabled=!!on}
  function timeOptions(selected){let out="";for(let h=12;h<=29;h++){for(const m of [0,30]){const v=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;out+=`<option ${v===selected?"selected":""}>${v}</option>`}}return out}
  function normalizeTime(v,fallback){v=String(v||"").trim();if(/^\d{1,2}:\d{2}$/.test(v)){let [h,m]=v.split(":").map(Number);if(h<12)h+=24;return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`}return fallback}
  function render(){countText.textContent=`${rows.length} 人`;if(!rows.length){shiftList.innerHTML='<div class="empty">当天没有“已出勤且已填写马甲”的女孩。<br>请先在女孩表填写马甲，并在纯出勤表中添加出勤。</div>';return}shiftList.innerHTML=rows.map((r,i)=>`<article class="row"><div class="num">${String(i+1).padStart(2,"0")}</div><div><div class="alias">${esc(r.alias)}</div><div class="source">MCR：${esc(r.name)}</div></div><div class="time"><select onchange="editRow(${i},'start',this.value)">${timeOptions(r.start)}</select><span>—</span><select onchange="editRow(${i},'end',this.value)">${timeOptions(r.end)}</select></div><label class="price"><input inputmode="numeric" value="${Number(r.price||0)||''}" onchange="editRow(${i},'price',this.value)"><span>円/h</span></label></article>`).join("")}
  window.editRow=function(i,key,value){if(!rows[i])return;rows[i][key]=key==="price"?parseMoney(value):value;imagePages=[];previewWrap.hidden=true;render()}
  window.loadMcrAttendance=async function(){busy(true,"正在读取爱丽丝 MCR 出勤…");try{const day=shiftDate.value||today;const [allRes,shiftRes]=await Promise.all([fetch(`/api/all?v=${Date.now()}`,{cache:"no-store",headers:authHeaders()}),fetch(`/api/pure_shifts?date=${encodeURIComponent(day)}&autocopy=0&v=${Date.now()}`,{cache:"no-store",headers:authHeaders()})]);const all=await allRes.json(),shift=await shiftRes.json();if(!allRes.ok||!all.ok)throw new Error(all.error||"女孩表读取失败");if(!shiftRes.ok||!shift.ok)throw new Error(shift.error||"出勤表读取失败");const girls=new Map((all.girls||[]).map(g=>[String(g.name||"").trim(),g]));rows=[];for(const s of shift.shifts||[]){const name=String(s.girl||"").trim(),g=girls.get(name),alias=String(g?.girl_alias||"").trim();if(!g||!alias)continue;rows.push({name,alias,start:normalizeTime(s.start,"18:00"),end:normalizeTime(s.end,"23:00"),price:Number(g.list_price||0),order:rows.length})}imagePages=[];previewWrap.hidden=true;render();const missing=(shift.shifts||[]).filter(s=>{const g=girls.get(String(s.girl||"").trim());return g&&!String(g.girl_alias||"").trim()}).map(s=>s.girl);setStatus(`已读取 ${rows.length} 人${missing.length?`；${missing.length} 人未填写马甲，未加入喵喵图：${missing.join("、")}`:""}`,missing.length?"bad":"good")}catch(e){console.error(e);rows=[];render();setStatus(e.message||"读取失败","bad")}finally{busy(false)}}
  function rounded(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
  function drawPage(pageRows,pageIndex,pageCount){const width=1080,rowH=132,headerH=250,footerH=105,height=headerH+pageRows.length*rowH+footerH;const c=document.createElement("canvas");c.width=width;c.height=height;const x=c.getContext("2d");x.fillStyle="#fffdf8";x.fillRect(0,0,width,height);x.strokeStyle="#eadfd1";x.lineWidth=2;for(let y=38;y<height;y+=38){x.beginPath();x.moveTo(32,y);x.lineTo(width-32,y);x.stroke()}x.fillStyle="rgba(224,187,197,.16)";x.fillRect(58,0,4,height);x.fillRect(72,0,1,height);x.strokeStyle="#c98aa0";x.lineWidth=5;rounded(x,18,18,width-36,height-36,24);x.stroke();x.strokeStyle="#a9b9a5";x.lineWidth=2;rounded(x,31,31,width-62,height-62,18);x.stroke();x.fillStyle="#8da28f";x.font="700 23px Georgia,serif";x.textAlign="center";x.fillText("NEKO MIAOMIAO",width/2,70);x.fillStyle="#b96881";x.font="900 60px 'Yu Mincho','Microsoft YaHei',serif";x.fillText("喵 喵 出 勤 表",width/2,142);const d=shiftDate.value||today;x.fillStyle="#75695e";x.font="700 27px 'Microsoft YaHei',sans-serif";x.fillText(`${d.replaceAll("-",".")}　${pageCount>1?`${pageIndex+1} / ${pageCount}`:""}`,width/2,194);x.textAlign="left";let y=headerH;pageRows.forEach((r,i)=>{const accent=i%2===0?"#d68aa0":"#93aa96";x.fillStyle=i%2===0?"rgba(246,220,227,.56)":"rgba(226,235,225,.62)";rounded(x,85,y+10,width-170,rowH-20,18);x.fill();x.fillStyle=accent;rounded(x,85,y+10,9,rowH-20,5);x.fill();x.fillStyle="#5d5147";x.font="900 38px 'Yu Mincho','Microsoft YaHei',serif";x.fillText(r.alias,125,y+62,300);x.fillStyle="#6d645c";x.font="800 29px 'Microsoft YaHei',sans-serif";x.fillText(`${r.start} — ${r.end}`,440,y+61,310);x.fillStyle="#9a6d43";x.font="900 31px Georgia,'Microsoft YaHei',serif";x.textAlign="right";x.fillText(r.price?`${yen(r.price)} / h`:"价格咨询",width-125,y+61,260);x.textAlign="left";x.fillStyle="#a99888";x.font="500 17px 'Microsoft YaHei',sans-serif";x.fillText("本日のご予約をお待ちしております",125,y+95);y+=rowH});x.fillStyle="#8da28f";x.font="700 22px Georgia,serif";x.textAlign="center";x.fillText("A quiet moment, made a little sweeter.",width/2,height-55);x.textAlign="left";return c}
  function canvasBlob(c){return new Promise(resolve=>c.toBlob(resolve,"image/png"))}
  function dataUrl(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
  window.generateImages=async function(announce=false){if(!rows.length){alert("没有可生成的喵喵出勤女孩");return []}busy(true,"正在生成高清信纸图…");try{imagePages=[];const count=Math.ceil(rows.length/PAGE_SIZE);for(let i=0;i<count;i++){const canvas=drawPage(rows.slice(i*PAGE_SIZE,(i+1)*PAGE_SIZE),i,count),blob=await canvasBlob(canvas);if(!blob)throw new Error("图片生成失败");imagePages.push({blob,url:URL.createObjectURL(blob),filename:`neko-attendance-${shiftDate.value||today}-${i+1}.png`})}previews.innerHTML=imagePages.map((p,i)=>`<div class="preview-card"><img src="${p.url}" alt="喵喵出勤图 ${i+1}"><div class="preview-actions"><button class="btn sage" onclick="copyImage(${i})">复制第${i+1}张</button><button class="btn" onclick="downloadImage(${i})">下载</button></div></div>`).join("");previewWrap.hidden=false;if(announce)setStatus(`已生成 ${imagePages.length} 张高清信纸图。`,"good");return imagePages}finally{busy(false)}}
  window.copyImage=async function(i){const p=imagePages[i];if(!p)return;try{await navigator.clipboard.write([new ClipboardItem({"image/png":p.blob})]);setStatus(`第 ${i+1} 张图片已复制。`,"good")}catch(e){setStatus("当前浏览器不允许复制图片，请使用下载。","bad")}}
  window.downloadImage=function(i){const p=imagePages[i];if(!p)return;const a=document.createElement("a");a.href=p.url;a.download=p.filename;a.click()}
  function buildText(){const d=shiftDate.value||today;return `${d} 喵喵出勤\n\n`+rows.map(r=>`${r.alias}　${r.start}-${r.end}　${r.price?yen(r.price)+"/h":"价格咨询"}`).join("\n")}
  window.copyShiftText=async function(){if(!rows.length){alert("当天没有喵喵出勤");return}try{await navigator.clipboard.writeText(buildText());setStatus("喵喵出勤文案已复制。","good")}catch(e){prompt("请手动复制",buildText())}}
  window.syncNekoAttendance=async function(){if(!rows.length){alert("当天没有可同步的喵喵出勤女孩");return}busy(true,"正在同步喵喵官网图片、文案和公开状态…");try{if(!imagePages.length)await generateImages(false);busy(true,"正在同步喵喵官网图片、文案和公开状态…");const image_data_list=[];for(const p of imagePages)image_data_list.push(await dataUrl(p.blob));const response=await fetch("/api/neko/attendance-sync",{method:"POST",headers:authHeaders(true),body:JSON.stringify({date:shiftDate.value||today,image_data_list,service_text:buildText(),attendance_names:rows.map(r=>r.alias)})});const result=await response.json();if(!response.ok||!result.ok)throw new Error(result.warning||result.error||"喵喵全面同步失败");const v=result.visibility||{},warnings=[];if(!v.synced)warnings.push(v.warning||"女孩公开状态部分失败");if((v.unmatched_attendance||[]).length)warnings.push(`官网未找到马甲：${v.unmatched_attendance.join("、")}`);setStatus(`全面同步完成：${imagePages.length} 张图，公开 ${v.published||0}，私密 ${v.privated||0}${warnings.length?`；${warnings.join("；")}`:""}`,warnings.length?"bad":"good")}catch(e){console.error(e);setStatus(e.message||"喵喵全面同步失败","bad");alert(e.message||"喵喵全面同步失败")}finally{busy(false)}}
  shiftDate.value=today;shiftDate.addEventListener("change",loadMcrAttendance);window.addEventListener("DOMContentLoaded",loadMcrAttendance);
})();
</script>
</body>
</html>
